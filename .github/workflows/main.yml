name: Track Mutual Funds

# Trigger the workflow at specific times using cron syntax
on:
  schedule:
    - cron: '30 4 * * *'  # This runs the workflow at 9 AM IST (4:30 AM UTC)
    - cron: '45 10 * * *'  # This runs the workflow at 3:15 PM IST (10:45 AM UTC)

  # Trigger workflow on push to the develop branch
  push:
    branches:
      - develop
  workflow_dispatch:  # This allows you to manually trigger the workflow if needed

jobs:
  run-script:
    runs-on: ubuntu-latest  # Using an Ubuntu runner
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # Checkout the code from the repo

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11.4'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Install dependencies from requirements.txt

    - name: Run script
      run: |
        python tracker.py  # Replace with the path to your script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}  # Use GitHub Secrets for the webhook
